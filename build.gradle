plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.eliasvoigt'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

javafx {
    version = '23.0.2'
    modules = [
            'javafx.controls',
            'javafx.swing'
    ]
}

application {
    mainClass = 'majority.MajorityBenchmark'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}