plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.yourname'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

javafx {
    version = '23.0.2'
    modules = [
            'javafx.controls',
            'javafx.swing'
    ]
}

application {
    mainClass = 'majority.MajorityBenchmark'
}

dependencies {
    // other dependencies here
}